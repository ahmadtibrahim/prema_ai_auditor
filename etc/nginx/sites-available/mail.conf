server {
    listen 80;
    server_name mail.premafirm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mail.premafirm.com;

    # TLS (currently reusing ERP cert; replace with one for mail.premafirm.com later)
    ssl_certificate     /etc/letsencrypt/live/erp.premafirm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.premafirm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Roundcube webmail
    root  /opt/www/roundcubemail;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php(?:$|/) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9999;   # change if using a php-fpm unix socket
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # --- iRedAdmin ---
    # Redirect bare path to trailing slash
    location = /iredadmin { return 301 /iredadmin/; }

    # Static files
    location /iredadmin/static/ {
        alias /opt/www/iredadmin/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # uwsgi app mounted at /iredadmin/
    location ~ ^/iredadmin(/.*)?$ {
        include uwsgi_params;
        uwsgi_param SCRIPT_NAME /iredadmin;
        uwsgi_param PATH_INFO $1;
        uwsgi_param UWSGI_SCHEME $scheme;
        uwsgi_pass unix:/run/uwsgi/iredadmin.socket;
    }
}
