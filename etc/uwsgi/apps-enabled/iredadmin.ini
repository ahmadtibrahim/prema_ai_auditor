[uwsgi]
uid = iredadmin
gid = iredadmin
chdir = /opt/www/iredadmin
wsgi-file = /opt/www/iredadmin/iredadmin.py
callable = app
master = true
processes = 2
virtualenv = /opt/www/iredadmin/venv
socket = /run/uwsgi/iredadmin.socket
chmod-socket = 660
vacuum = true
die-on-term = true
plugin = python3
logto = /var/log/uwsgi/iredadmin.log
logto = /var/log/uwsgi/iredadmin.log
